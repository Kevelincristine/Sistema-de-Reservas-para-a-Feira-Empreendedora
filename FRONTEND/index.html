<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feira da Praça — Barracas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --canvas:#f2e9d8;
    --awning-a:#b5482f;
    --awning-b:#f2e9d8;
    --ink:#241a12;
    --olive:#5c6b3f;
    --mustard:#d69a2d;
    --card:#fffaf0;
    --line: rgba(36,26,18,0.15);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; }

  /* ---------- header / awning ---------- */
  header.top{
    position:relative;
    overflow:hidden;
    background: repeating-linear-gradient(
      100deg,
      var(--awning-a) 0px, var(--awning-a) 40px,
      var(--awning-b) 40px, var(--awning-b) 80px
    );
    padding: 34px 24px 42px;
    text-align:center;
    border-bottom: 6px solid var(--ink);
  }
  header.top::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-2px; height:26px;
    background:
      radial-gradient(circle at 20px 0, transparent 18px, var(--canvas) 19px) repeat-x;
    background-size:40px 26px;
  }
  header.top .eyebrow{
    display:inline-block;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#fff;
    background:var(--ink);
    padding:6px 14px;
    border-radius:2px;
    margin-bottom:16px;
  }
  header.top .title-block{
    display:inline-block;
    background:rgba(20,14,8,.42);
    border-radius:16px;
    padding:14px 28px 20px;
  }
  header.top h1{
    color:#fff;
    font-size:clamp(40px,7vw,76px);
    font-weight:700;
    text-shadow: 3px 3px 0 var(--ink), 0 0 18px rgba(0,0,0,.5);
    line-height:1;
  }
  header.top p{
    color:#fff;
    max-width:480px;
    margin:14px auto 0;
    font-size:16px;
    font-weight:600;
    text-shadow: 1px 1px 0 rgba(0,0,0,.6), 0 0 10px rgba(0,0,0,.4);
  }

  /* ---------- login ---------- */
  .login-corner{
    position:absolute;
    top:18px; right:18px;
    z-index:5;
  }
  .login-btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    border:2px solid #fff;
    background:rgba(20,14,8,.5);
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition: background .15s ease;
  }
  .login-btn:hover{ background:rgba(20,14,8,.75); }
  .user-chip{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    background:#fff;
    color:var(--ink);
    padding:6px 8px 6px 14px;
    border-radius:999px;
    display:flex; align-items:center; gap:10px;
    border:2px solid var(--ink);
  }
  .user-chip .avatar{
    width:26px; height:26px; border-radius:50%;
    background:var(--olive); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
  }
  .user-chip button{
    border:none; background:var(--ink); color:#fff;
    font-size:11px; font-weight:700; letter-spacing:.03em;
    padding:6px 10px; border-radius:999px; cursor:pointer;
  }

  .auth-overlay{
    position:fixed; inset:0; background:rgba(20,14,8,.55);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:200;
    backdrop-filter: blur(2px);
  }
  .auth-overlay.open{ display:flex; }
  .auth-panel{
    background:var(--card);
    width:100%; max-width:380px;
    border:2px solid var(--ink); border-radius:14px;
    box-shadow:10px 10px 0 rgba(0,0,0,.25);
    padding:28px 26px 26px;
    position:relative;
    animation: rise .25s ease;
  }
  .auth-panel .close{
    position:absolute; top:12px; right:12px;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff; border:none;
    font-size:16px; cursor:pointer;
  }
  .auth-panel h2{ font-size:24px; margin-bottom:4px; }
  .auth-panel .sub{ font-size:13px; color:#6b5f4d; margin-bottom:20px; }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .auth-tabs button{
    flex:1; padding:8px; border-radius:999px; border:2px solid var(--ink);
    background:var(--card); font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:13px; cursor:pointer; color:var(--ink);
  }
  .auth-tabs button.active{ background:var(--olive); color:#fff; border-color:var(--olive); }
  .auth-form label{
    display:block; font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:6px; color:#5c5142;
  }
  .auth-form input{
    width:100%; border:2px solid var(--ink); border-radius:8px;
    padding:10px 12px; margin-bottom:14px; font-family:'Space Grotesk',sans-serif;
    font-size:14px; background:#fffefb;
  }
  .auth-form input:focus{ outline:2px solid var(--mustard); }
  .auth-submit{
    width:100%; border:2px solid var(--ink); background:var(--ink); color:#fff;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    padding:12px; border-radius:999px; cursor:pointer; margin-top:4px;
  }
  .auth-submit:hover{ background:#3a2f22; }
  .auth-error{
    color:var(--awning-a); font-size:12.5px; font-weight:700; margin:-6px 0 12px;
    display:none;
  }
  .auth-error.show{ display:block; }

  /* ---------- admin dashboard ---------- */
  .admin-overlay{
    position:fixed; inset:0; background:rgba(20,14,8,.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; z-index:200; overflow-y:auto;
    backdrop-filter: blur(2px);
  }
  .admin-overlay.open{ display:flex; }
  .admin-panel{
    background:var(--card);
    max-width:720px; width:100%;
    border:2px solid var(--ink); border-radius:14px;
    box-shadow:10px 10px 0 rgba(0,0,0,.25);
    padding:30px 30px 34px;
    position:relative;
    animation: rise .25s ease;
  }
  .admin-panel .close{
    position:absolute; top:14px; right:14px;
    width:36px; height:36px; border-radius:50%;
    background:var(--ink); color:#fff; border:none;
    font-size:18px; cursor:pointer;
  }
  .admin-panel h2{ font-size:28px; margin-bottom:4px; }
  .admin-panel .sub{ font-size:13px; color:#6b5f4d; margin-bottom:24px; }
  .admin-stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; margin-bottom:28px;
  }
  .admin-stats .stat{
    border:2px solid var(--ink); border-radius:10px; padding:14px 16px;
    background:#fffefb;
  }
  .admin-stats .stat .num{ font-family:'Fraunces',serif; font-size:28px; }
  .admin-stats .stat .label{ font-size:12px; color:#6b5f4d; text-transform:uppercase; letter-spacing:.04em; }
  .admin-list{ display:flex; flex-direction:column; gap:10px; }
  .admin-row{
    display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:12px;
  }
  .admin-row .rank{ font-weight:700; color:#6b5f4d; font-size:13px; }
  .admin-row .info{ min-width:0; }
  .admin-row .info .name{ font-weight:700; font-size:14px; }
  .admin-row .info .cat{ font-size:11px; color:#6b5f4d; }
  .admin-row .bar-wrap{ background:#e9dfc9; border:2px solid var(--ink); border-radius:999px; height:10px; overflow:hidden; margin-top:4px; }
  .admin-row .bar{ height:100%; background:var(--olive); }
  .admin-row .count{ font-weight:700; font-size:15px; min-width:34px; text-align:right; }
  .admin-empty{ text-align:center; color:#6b5f4d; font-size:14px; padding:20px 0; }



  /* ---------- filter bar ---------- */
  .filters{
    max-width:1080px;
    margin:36px auto 0;
    padding:0 24px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .filters button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:14px;
    border:2px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .filters button:hover{ transform:translateY(-2px); }
  .filters button.active{
    background:var(--olive);
    color:#fff;
    border-color:var(--olive);
  }

  /* ---------- search bar ---------- */
  .search-wrap{
    max-width:560px;
    margin:32px auto 0;
    padding:0 24px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:999px;
    padding:10px 18px;
    box-shadow:4px 4px 0 var(--line);
  }
  .search-box svg{ flex:none; }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .search-box input::placeholder{ color:#8a7c66; }

  /* ---------- grid ---------- */
  main{
    max-width:1080px;
    margin:32px auto 80px;
    padding:0 24px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:26px;
  }
  .stall-card{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    transition: transform .2s ease, box-shadow .2s ease;
    box-shadow: 5px 5px 0 var(--line);
  }
  .stall-card:hover{
    transform: translate(-3px,-3px);
    box-shadow: 8px 8px 0 var(--mustard);
  }
  .stall-card img{
    width:100%; height:170px; object-fit:cover; display:block;
    border-bottom:2px solid var(--ink);
  }
  .stall-card .tag{
    position:absolute; top:10px; left:10px;
    background:var(--ink); color:#fff;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px;
  }
  .stall-card .body{ padding:16px 18px 20px; }
  .stall-card h3{ font-size:22px; margin-bottom:4px; }
  .stall-card .loc{
    font-size:13px; color:#5c5142; display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .stall-card .desc{ font-size:13.5px; line-height:1.4; color:#3a2f22; }
  .stall-card .more{
    margin-top:12px; font-size:13px; font-weight:700; color:var(--awning-a);
  }

  /* ---------- detail overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,14,8,.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; z-index:100; overflow-y:auto;
    backdrop-filter: blur(2px);
  }
  .overlay.open{ display:flex; }
  .panel{
    background:var(--card);
    max-width:820px; width:100%;
    border:2px solid var(--ink); border-radius:14px;
    box-shadow:10px 10px 0 rgba(0,0,0,.25);
    overflow:hidden;
    animation: rise .25s ease;
  }
  @keyframes rise{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }

  .panel-head{ position:relative; }
  .panel-head .close{
    position:absolute; top:14px; right:14px;
    width:36px; height:36px; border-radius:50%;
    background:var(--ink); color:#fff; border:none;
    font-size:18px; cursor:pointer; z-index:5;
  }
  .gallery{ display:grid; grid-template-columns: 2fr 1fr; gap:4px; height:280px; }
  .gallery img{ width:100%; height:100%; object-fit:cover; }
  .gallery .side{ display:grid; grid-template-rows:1fr 1fr; gap:4px; }

  .panel-body{ padding:26px 30px 34px; }
  .panel-body .tag{
    display:inline-block; background:var(--mustard); color:var(--ink);
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    padding:4px 10px; border-radius:999px; margin-bottom:10px; font-weight:700;
  }
  .panel-body h2{ font-size:34px; margin-bottom:6px; }
  .panel-body .owner{ color:#6b5f4d; font-size:14px; margin-bottom:16px; }
  .panel-body .about{ font-size:15px; line-height:1.6; margin-bottom:22px; }

  .loc-block{
    display:flex; gap:16px; align-items:flex-start;
    border:2px solid var(--ink); border-radius:10px; padding:14px 16px;
    margin-bottom:26px; background:#fffefb;
  }
  .loc-block .pin{
    width:44px; height:44px; border-radius:50%; background:var(--olive);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:20px; flex:none;
  }
  .loc-block .info b{ display:block; font-size:15px; margin-bottom:2px; }
  .loc-block .info span{ font-size:13px; color:#5c5142; }
  .loc-block .hours{ margin-top:6px; font-size:13px; color:var(--awning-a); font-weight:700; }

  .section-label{
    font-family:'Fraunces',serif; font-size:20px; margin-bottom:14px;
    border-bottom:3px solid var(--ink); padding-bottom:6px;
  }

  .products{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px;
  }
  .product{
    border:2px solid var(--ink); border-radius:10px; overflow:hidden; background:#fff;
  }
  .product img{ width:100%; height:130px; object-fit:cover; border-bottom:2px solid var(--ink); }
  .product .pbody{ padding:12px 14px 14px; }
  .product h4{ font-size:15px; margin-bottom:3px; }
  .product .price{ color:var(--awning-a); font-weight:700; font-size:14px; margin-bottom:5px; }
  .product p{ font-size:12.5px; line-height:1.4; color:#4a4030; }

  @media (max-width:560px){
    .gallery{ grid-template-columns:1fr; height:auto; }
    .gallery .side{ grid-template-columns:1fr 1fr; grid-template-rows:none; height:110px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="login-corner" id="loginCorner"></div>
  <div class="title-block">
    <h1>Feira da Praça</h1>
    <p>Um mapa vivo de barracas — histórias, gente e produtos feitos por quem faz de verdade.</p>
  </div>
</header>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-panel">
    <button class="close" id="authClose">✕</button>
    <div class="auth-tabs">
      <button data-mode="login" class="active" id="tabLogin">Entrar</button>
      <button data-mode="register" id="tabRegister">Criar conta</button>
    </div>
    <h2 id="authTitle">Bem-vindo de volta</h2>
    <p class="sub" id="authSub">Entre para salvar suas barracas favoritas.</p>
    <div class="auth-error" id="authError"></div>
    <form class="auth-form" id="authForm">
      <div id="nameField" style="display:none">
        <label for="authName">Nome</label>
        <input type="text" id="authName" placeholder="Seu nome">
      </div>
      <label for="authEmail">E-mail</label>
      <input type="email" id="authEmail" placeholder="voce@email.com" required>
      <label for="authPass">Senha</label>
      <input type="password" id="authPass" placeholder="••••••••" required>
      <button type="submit" class="auth-submit" id="authSubmitBtn">Entrar</button>
    </form>
  </div>
</div>

<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <button class="close" id="adminClose">✕</button>
    <h2>Movimento das barracas</h2>
    <p class="sub">Quantidade de vezes que cada barraca foi aberta pelos visitantes.</p>
    <div class="admin-stats" id="adminStats"></div>
    <div class="admin-list" id="adminList"></div>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="Buscar barraca, produto ou categoria...">
  </div>
</div>

<div class="filters" id="filters"></div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

/* ---------- login system ---------- */
const ADMIN_CREDENTIALS = {
  email: "adminnuzzi26@gmail.com",
  pass: "feira nuzzi26",
  name: "admin"
};

const loginCorner = document.getElementById('loginCorner');
const authOverlay = document.getElementById('authOverlay');
const authForm = document.getElementById('authForm');
const authError = document.getElementById('authError');
const authTitle = document.getElementById('authTitle');
const authSub = document.getElementById('authSub');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const nameField = document.getElementById('nameField');
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
let authMode = 'login';

function getUsers(){
  return JSON.parse(localStorage.getItem('feira_users') || '{}');
}
function saveUsers(users){
  localStorage.setItem('feira_users', JSON.stringify(users));
}
function getSession(){
  return JSON.parse(localStorage.getItem('feira_session') || 'null');
}
function setSession(user){
  localStorage.setItem('feira_session', JSON.stringify(user));
}
function clearSession(){
  localStorage.removeItem('feira_session');
}

/* ---------- movimento das barracas (tracking) ---------- */
function getVisits(){
  return JSON.parse(localStorage.getItem('feira_visits') || '{}');
}
function registerVisit(id){
  const visits = getVisits();
  visits[id] = (visits[id] || 0) + 1;
  localStorage.setItem('feira_visits', JSON.stringify(visits));
}

function renderLoginCorner(){
  const session = getSession();
  if(session){
    const initial = session.name.trim().charAt(0).toUpperCase();
    const adminBtn = session.isAdmin
      ? `<button id="adminBtn" title="Movimento das barracas">📊</button>`
      : '';
    loginCorner.innerHTML = `
      <div class="user-chip">
        <div class="avatar">${initial}</div>
        <span>${session.name.split(' ')[0]}</span>
        ${adminBtn}
        <button id="logoutBtn">Sair</button>
      </div>
    `;
    document.getElementById('logoutBtn').addEventListener('click', ()=>{
      clearSession();
      renderLoginCorner();
    });
    if(session.isAdmin){
      document.getElementById('adminBtn').addEventListener('click', openAdmin);
    }
  } else {
    loginCorner.innerHTML = `<button class="login-btn" id="openAuthBtn">👤 Entrar</button>`;
    document.getElementById('openAuthBtn').addEventListener('click', openAuth);
  }
}

function setAuthMode(mode){
  authMode = mode;
  authError.classList.remove('show');
  authForm.reset();
  if(mode === 'login'){
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
    authTitle.textContent = 'Bem-vindo de volta';
    authSub.textContent = 'Entre para salvar suas barracas favoritas.';
    nameField.style.display = 'none';
    authSubmitBtn.textContent = 'Entrar';
  } else {
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
    authTitle.textContent = 'Criar conta';
    authSub.textContent = 'Cadastre-se para acompanhar a feira.';
    nameField.style.display = 'block';
    authSubmitBtn.textContent = 'Criar conta';
  }
}

function openAuth(){
  setAuthMode('login');
  authOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeAuth(){
  authOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

tabLogin.addEventListener('click', ()=> setAuthMode('login'));
tabRegister.addEventListener('click', ()=> setAuthMode('register'));
document.getElementById('authClose').addEventListener('click', closeAuth);
authOverlay.addEventListener('click', (e)=>{ if(e.target === authOverlay) closeAuth(); });

authForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const pass = document.getElementById('authPass').value;

  // login administrativo com credenciais fixas
  if(authMode === 'login' && email === ADMIN_CREDENTIALS.email && pass === ADMIN_CREDENTIALS.pass){
    setSession({ email, name: ADMIN_CREDENTIALS.name, isAdmin: true });
    renderLoginCorner();
    closeAuth();
    return;
  }

  const users = getUsers();

  if(authMode === 'register'){
    const name = document.getElementById('authName').value.trim();
    if(!name){
      authError.textContent = 'Informe seu nome.';
      authError.classList.add('show');
      return;
    }
    if(users[email] || email === ADMIN_CREDENTIALS.email){
      authError.textContent = 'Este e-mail já está cadastrado.';
      authError.classList.add('show');
      return;
    }
    users[email] = { name, pass };
    saveUsers(users);
    setSession({ email, name });
    renderLoginCorner();
    closeAuth();
  } else {
    const user = users[email];
    if(!user || user.pass !== pass){
      authError.textContent = 'E-mail ou senha incorretos.';
      authError.classList.add('show');
      return;
    }
    setSession({ email, name: user.name });
    renderLoginCorner();
    closeAuth();
  }
});

/* ---------- admin dashboard ---------- */
const adminOverlay = document.getElementById('adminOverlay');
const adminStats = document.getElementById('adminStats');
const adminList = document.getElementById('adminList');

function openAdmin(){
  renderAdminDashboard();
  adminOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeAdmin(){
  adminOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('adminClose').addEventListener('click', closeAdmin);
adminOverlay.addEventListener('click', (e)=>{ if(e.target === adminOverlay) closeAdmin(); });

function renderAdminDashboard(){
  const visits = getVisits();
  const rows = STALLS.map(s => ({
    id: s.id, name: s.name, category: s.category,
    count: visits[s.id] || 0
  })).sort((a,b) => b.count - a.count);

  const totalVisits = rows.reduce((sum,r) => sum + r.count, 0);
  const mostVisited = rows[0] && rows[0].count > 0 ? rows[0].name : "—";
  const activeStalls = rows.filter(r => r.count > 0).length;

  adminStats.innerHTML = `
    <div class="stat"><div class="num">${totalVisits}</div><div class="label">Acessos totais</div></div>
    <div class="stat"><div class="num">${activeStalls}/${rows.length}</div><div class="label">Barracas visitadas</div></div>
    <div class="stat"><div class="num" style="font-size:16px; line-height:1.3;">${mostVisited}</div><div class="label">Mais acessada</div></div>
  `;

  if(totalVisits === 0){
    adminList.innerHTML = `<div class="admin-empty">Ainda não há acessos registrados. Os cliques nas barracas aparecerão aqui.</div>`;
    return;
  }

  const max = rows[0].count || 1;
  adminList.innerHTML = rows.map((r, i) => `
    <div class="admin-row">
      <div class="rank">#${i+1}</div>
      <div class="info">
        <div class="name">${r.name}</div>
        <div class="cat">${r.category}</div>
        <div class="bar-wrap"><div class="bar" style="width:${(r.count/max*100).toFixed(0)}%"></div></div>
      </div>
      <div class="count">${r.count}</div>
    </div>
  `).join('');
}

renderLoginCorner();

const HIDDEN_CATS = ["Frutas & Verduras", "Artesanato", "Flores & Plantas", "Laticínios"];
const categories = ["Todas", ...new Set(STALLS.map(s => s.category).filter(c => !HIDDEN_CATS.includes(c)))];
const filtersEl = document.getElementById('filters');
const gridEl = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const searchInput = document.getElementById('searchInput');
let activeCat = "Todas";
let searchTerm = "";

function renderFilters(){
  filtersEl.innerHTML = categories.map(c =>
    `<button data-cat="${c}" class="${c===activeCat?'active':''}">${c}</button>`
  ).join('');
  filtersEl.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCat = btn.dataset.cat;
      renderFilters();
      renderGrid();
    });
  });
}

function renderGrid(){
  let list = activeCat === "Todas" ? STALLS : STALLS.filter(s=>s.category===activeCat);
  const term = searchTerm.trim().toLowerCase();
  if(term){
    list = list.filter(s =>
      s.name.toLowerCase().includes(term) ||
      s.category.toLowerCase().includes(term) ||
      s.desc.toLowerCase().includes(term) ||
      s.products.some(p => p.name.toLowerCase().includes(term))
    );
  }
  if(list.length === 0){
    gridEl.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:40px 0; color:#6b5f4d;">Nenhuma barraca encontrada.</p>`;
    return;
  }
  gridEl.innerHTML = list.map(s => `
    <div class="stall-card" data-id="${s.id}">
      <span class="tag">${s.category}</span>
      <img src="${s.cover}" alt="${s.name}">
      <div class="body">
        <h3>${s.name}</h3>
        <div class="loc">📍 ${s.address.split('—')[0].trim()}</div>
        <div class="desc">${s.desc}</div>
        <div class="more">Saiba mais →</div>
      </div>
    </div>
  `).join('');
  gridEl.querySelectorAll('.stall-card').forEach(card=>{
    card.addEventListener('click', ()=> openStall(Number(card.dataset.id)));
  });
}

function openStall(id){
  const s = STALLS.find(x=>x.id===id);
  registerVisit(id);
  panel.innerHTML = `
    <div class="panel-head">
      <button class="close" id="closeBtn">✕</button>
      <div class="gallery">
        <img src="${s.gallery[0]}" alt="${s.name}">
        <div class="side">
          <img src="${s.gallery[1]}" alt="${s.name} detalhe 1">
          <img src="${s.gallery[2]}" alt="${s.name} detalhe 2">
        </div>
      </div>
    </div>
    <div class="panel-body">
      <span class="tag">${s.category}</span>
      <h2>${s.name}</h2>
      <div class="owner">por ${s.owner}</div>
      <p class="about">${s.about}</p>

      <div class="loc-block">
        <div class="pin">📍</div>
        <div class="info">
          <b>${s.address}</b>
          <span>Localização dentro da feira</span>
          <div class="hours">🕒 ${s.hours}</div>
        </div>
      </div>

      <div class="section-label">Produtos</div>
      <div class="products">
        ${s.products.map(p => `
          <div class="product">
            <img src="${p.img}" alt="${p.name}">
            <div class="pbody">
              <h4>${p.name}</h4>
              <div class="price">${p.price}</div>
              <p>${p.desc}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeStall);
  document.body.style.overflow = 'hidden';
}

function closeStall(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeStall(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeStall(); });

searchInput.addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderGrid();
});

renderFilters();
renderGrid();
</script>
